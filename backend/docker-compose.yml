version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetra
      POSTGRES_PASSWORD: vetra123
      POSTGRES_DB: vetra
    ports:
      - "5432:5432"
    volumes:
      - postgres_vetra:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetra"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_vetra:
